services:
  - type: web
    name: quiz-battle-arena
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/qba.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: qba-data
      mountPath: /var/data
      sizeGB: 1
